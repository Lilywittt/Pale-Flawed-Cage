<svg viewBox="0 0 888 228" width="888" height="228" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <g id="ct-sta"><polygon points="1,-5.5 -3.8,0.8 0,0.8 -1,5.5 3.8,-0.8 0,-0.8" fill="#eab308" /></g>
    <g id="ct-psy-res"><polygon points="0,-5.5 4.8,0 0,5.5 -4.8,0" fill="#a855f7" /><circle r="1.5" fill="#ffffff" /></g>
    <g id="ct-clu-res"><circle cx="-1" cy="-1" r="3.5" fill="none" stroke="#10b981" stroke-width="1.8" /><line x1="1.5" y1="1.5" x2="4.6" y2="4.6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" /></g>
    <g id="ct-haz-res"><polygon points="0,-5.2 5.2,4.5 -5.2,4.5" fill="none" stroke="#ef4444" stroke-width="1.7" stroke-linejoin="round" /><line x1="0" y1="-1.2" x2="0" y2="2.2" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" /></g>

    <!-- Circular Tag Medallions (r=10.5) -->
    <g id="tg-clue"><circle r="10.5" fill="#059669" stroke="#ffffff" stroke-width="1.5" /><circle cx="-1" cy="-1" r="3.6" fill="none" stroke="#ffffff" stroke-width="1.8" /><line x1="1.6" y1="1.6" x2="5" y2="5" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" /></g>
    <g id="tg-place"><circle r="10.5" fill="#57534e" stroke="#ffffff" stroke-width="1.5" /><polygon points="0,-5.6 5.8,-1.3 -5.8,-1.3" fill="#ffffff" /><rect x="-4.1" y="-0.6" width="8.2" height="5.5" rx="0.7" fill="none" stroke="#ffffff" stroke-width="1.5" /></g>
    <g id="tg-psy"><circle r="10.5" fill="#9333ea" stroke="#ffffff" stroke-width="1.5" /><polygon points="0,-6.2 5.4,0 0,6.2 -5.4,0" fill="#ffffff" /><circle r="1.9" fill="#9333ea" /></g>
    <g id="tg-truth"><circle r="10.5" fill="#1e3a8a" stroke="#ffffff" stroke-width="1.5" /><path d="M-6.2,0 Q0,-5.2 6.2,0 Q0,5.2 -6.2,0 Z" fill="none" stroke="#ffffff" stroke-width="1.6" /><circle r="2.2" fill="#fbbf24" /></g>
    <g id="tg-scheme"><circle r="10.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" /><polygon points="0,-5.5 5.5,4.6 -5.5,4.6" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round" /><line x1="0" y1="-1.2" x2="0" y2="2.3" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" /></g>
    <g id="tg-event"><circle r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" /><line x1="0" y1="-5.4" x2="0" y2="3.8" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" /><polyline points="-4,0.2 0,4.6 4,0.2" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /></g>
  </defs>

  <rect x="4" y="4" width="880" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ==================== CARD 1: 绿牌 · 即时行动牌 (x=122, y=16, w=164, h=196) ==================== -->
  <g transform="translate(122, 16)">
    <rect width="164" height="196" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2.2" />
    <rect x="1.5" y="1.5" width="161" height="32" rx="8.5" fill="#d1fae5" />

    <!-- Cost Box -->
    <rect x="8" y="6" width="30" height="22" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.4" />
    <g transform="translate(15.5, 17) scale(0.75)"><use href="#ct-sta" /></g>
    <text x="28" y="20.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#854d0e">--</text>

    <!-- Top-Right Tag Medallions -->
    <g transform="translate(125, 17)"><use href="#tg-clue" /></g>
    <g transform="translate(148, 17)"><use href="#tg-place" /></g>

    <!-- Card Type Ribbon -->
    <text x="82" y="51" text-anchor="middle" font-size="11.5" font-weight="800" fill="#065f46">即时行动牌</text>

    <!-- Clean Art Window -->
    <rect x="12" y="59" width="140" height="72" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2" />
    <line x1="36" y1="59" x2="36" y2="131" stroke="#dcfce7" stroke-width="1.2" />
    <line x1="128" y1="59" x2="128" y2="131" stroke="#dcfce7" stroke-width="1.2" />
    <rect x="58" y="75" width="48" height="40" rx="3" fill="#ffffff" stroke="#86efac" stroke-width="1.4" />
    <circle cx="82" cy="95" r="7" fill="none" stroke="#10b981" stroke-width="1.6" />

    <!-- Bottom Effect Icons (Production Box + Instant Resource) -->
    <rect x="12" y="140" width="140" height="44" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
    <g transform="translate(56, 162)">
      <rect x="-18" y="-12" width="36" height="24" rx="3.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2" />
      <text x="-6" y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#334155">+</text>
      <g transform="translate(7, 0)"><use href="#ct-clu-res" /></g>
    </g>
    <g transform="translate(110, 162)">
      <text x="-9" y="4" text-anchor="middle" font-size="10.5" font-weight="800" fill="#059669">+2</text>
      <g transform="translate(9, 0)"><use href="#ct-clu-res" /></g>
    </g>
  </g>

  <!-- ==================== CARD 2: 蓝牌 · 常驻行动牌 (x=362, y=16, w=164, h=196) ==================== -->
  <g transform="translate(362, 16)">
    <rect width="164" height="196" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2.2" />
    <rect x="1.5" y="1.5" width="161" height="32" rx="8.5" fill="#dbeafe" />

    <!-- Cost + Requirement Badge -->
    <rect x="8" y="6" width="30" height="22" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.4" />
    <g transform="translate(15.5, 17) scale(0.75)"><use href="#ct-sta" /></g>
    <text x="28" y="20.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#854d0e">--</text>

    <rect x="42" y="7" width="32" height="20" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.2" />
    <text x="50" y="20" text-anchor="middle" font-size="9" font-weight="800" fill="#dc2626">3</text>
    <g transform="translate(64, 17) scale(0.62)"><use href="#tg-truth" /></g>

    <!-- Top-Right Tag Medallions -->
    <g transform="translate(125, 17)"><use href="#tg-psy" /></g>
    <g transform="translate(148, 17)"><use href="#tg-truth" /></g>

    <!-- Card Type Ribbon -->
    <text x="82" y="51" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1e40af">常驻行动牌</text>

    <!-- Clean Art Window -->
    <rect x="12" y="59" width="140" height="72" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
    <path d="M 28 95 L 54 95 L 66 74 L 82 114 L 96 84 L 108 95 L 136 95" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Effect Icons (Active / Passive Arrow Formula) -->
    <rect x="12" y="140" width="140" height="44" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
    <g transform="translate(46, 162)"><use href="#ct-psy-res" transform="scale(1.15)" /></g>
    <path d="M 68 162 L 92 162" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" />
    <polygon points="90,157.5 98,162 90,166.5" fill="#2563eb" />
    <text x="112" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#1e40af">+1</text>
    <g transform="translate(128, 162)"><use href="#ct-sta" transform="scale(1.1)" /></g>
  </g>

  <!-- ==================== CARD 3: 红牌 · 事件牌 (x=602, y=16, w=164, h=196) ==================== -->
  <g transform="translate(602, 16)">
    <rect width="164" height="196" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.2" />
    <rect x="1.5" y="1.5" width="161" height="32" rx="8.5" fill="#fee2e2" />

    <!-- Cost Box -->
    <rect x="8" y="6" width="30" height="22" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1.4" />
    <g transform="translate(15.5, 17) scale(0.75)"><use href="#ct-sta" /></g>
    <text x="28" y="20.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#854d0e">--</text>

    <!-- Top-Right Tag Medallions -->
    <g transform="translate(125, 17)"><use href="#tg-scheme" /></g>
    <g transform="translate(148, 17)"><use href="#tg-event" /></g>

    <!-- Card Type Ribbon -->
    <text x="82" y="51" text-anchor="middle" font-size="11.5" font-weight="800" fill="#991b1b">事件牌</text>

    <!-- Clean Art Window -->
    <rect x="12" y="59" width="140" height="72" rx="5" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" />
    <circle cx="82" cy="95" r="20" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="4 3" />
    <polygon points="82,78 96,105 68,105" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Bottom Effect Icons + Endgame VP Emblem -->
    <rect x="12" y="140" width="140" height="44" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="48" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#dc2626">+3</text>
    <g transform="translate(68, 162)"><use href="#ct-haz-res" transform="scale(1.15)" /></g>
    <g transform="translate(126, 162)">
      <circle r="13" fill="#0f172a" />
      <text x="0" y="3.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ffffff">因</text>
    </g>
  </g>
</svg>
