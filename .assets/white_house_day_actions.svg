    <g id="da-clu"><circle cx="-1" cy="-1" r="3.5" fill="none" stroke="#10b981" stroke-width="1.8" /><line x1="1.5" y1="1.5" x2="4.6" y2="4.6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" /></g>
    <g id="da-haz"><polygon points="0,-5.2 5,4.4 -5,4.4" fill="none" stroke="#ef4444" stroke-width="1.7" stroke-linejoin="round" /><line x1="0" y1="-1.1" x2="0" y2="2" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" /></g>
    <g id="da-opp"><rect x="-4.2" y="-4.8" width="8.4" height="9.6" rx="1.4" fill="none" stroke="#6366f1" stroke-width="1.7" /><circle r="1.6" fill="#6366f1" /></g>
