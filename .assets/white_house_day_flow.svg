  <!-- Outer Frame -->
  <rect x="4" y="4" width="880" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- DAY 1 Direct Entry Badge -->
  <g transform="translate(302, 8)">
    <rect x="0" y="0" width="52" height="17" rx="8.5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
    <text x="26" y="11.8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">DAY 1</text>
    <line x1="26" y1="17" x2="26" y2="25" stroke="#3b82f6" stroke-width="1.5" />
    <polyline points="23,22.5 26,26 29,22.5" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- PHASE 1: 晨间 -->
  <g transform="translate(18, 34)">
    <rect width="236" height="148" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
    <rect x="1" y="1" width="234" height="27" rx="7" fill="#fef9c3" />
    <circle cx="19" cy="14.5" r="8.5" fill="#ca8a04" />
    <text x="19" y="18" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">1</text>
    <text x="35" y="19" font-size="12" font-weight="800" fill="#713f12">晨间</text>
    <g transform="translate(212, 17)">
      <path d="M-7,0 A7,7 0 0,1 7,0" fill="#facc15" stroke="#ca8a04" stroke-width="1.2" />
      <line x1="-10" y1="1" x2="10" y2="1" stroke="#ca8a04" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <g transform="translate(14, 38)">
      <rect width="208" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <rect x="12" y="9" width="58" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="41" y="23.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">DAY +1</text>
      <line x1="84" y1="8" x2="84" y2="32" stroke="#e2e8f0" />
      <circle cx="106" cy="20" r="6" fill="#3b82f6" />
      <g transform="translate(124, 20)"><use href="#df-swap" /></g>
      <circle cx="142" cy="20" r="6" fill="#ec4899" />
      <rect x="156" y="10" width="40" height="20" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="1.1" />
      <text x="176" y="23.5" text-anchor="middle" font-size="9" font-weight="800" fill="#065f46">先手</text>
    </g>

    <g transform="translate(14, 86)">
      <rect width="208" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <g transform="translate(16, 15)">
