  <g transform="translate(270, 108)"><use href="#df-phase-arr" /></g>

  <!-- PHASE 2: 日间 -->
  <g transform="translate(286, 34)">
    <rect width="288" height="148" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
    <rect x="1" y="1" width="286" height="27" rx="7" fill="#dbeafe" />
    <circle cx="19" cy="14.5" r="8.5" fill="#2563eb" />
    <text x="19" y="18" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">2</text>
    <text x="35" y="19" font-size="12" font-weight="800" fill="#1e3a8a">日间</text>
    <g transform="translate(264, 14.5)">
