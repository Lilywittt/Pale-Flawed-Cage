        <rect x="12" y="1" width="15" height="22" rx="2" fill="#dbeafe" stroke="#3b82f6" />
        <rect x="24" y="3" width="15" height="22" rx="2" fill="#fee2e2" stroke="#ef4444" />
        <rect x="36" y="5" width="15" height="22" rx="2" fill="#dcfce7" stroke="#10b981" />
