      <polyline points="0.8,-2.8 4.5,0 0.8,2.8" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g id="df-swap">
      <path d="M-5,-2 H4 M2,-4.2 L4.5,-2 L2,0.2" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M5,2.2 H-4 M-2,0 L-4.5,2.2 L-2,4.4" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
