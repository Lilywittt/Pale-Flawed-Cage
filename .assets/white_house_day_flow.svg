      <g transform="translate(18, 40)">
        <rect x="0" y="0" width="70" height="22" rx="4.5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" />
        <text x="35" y="14.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1d4ed8">动作 1</text>
