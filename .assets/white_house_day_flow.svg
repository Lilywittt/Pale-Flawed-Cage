        <text x="134" y="14.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">结束今日</text>
      </g>

      <!-- Row 3: Direct End Day -->
      <g transform="translate(18, 68)">
        <rect x="0" y="0" width="80" height="22" rx="4.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
        <text x="40" y="14.8" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">结束今日</text>
      </g>
