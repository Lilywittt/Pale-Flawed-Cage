        <text x="-5" y="3.5" font-size="9" font-weight="800" fill="#854d0e">-</text>
        <g transform="translate(4, 0) scale(0.75)"><use href="#df-sta" /></g>
      </g>
      <g transform="translate(120, 26)"><use href="#df-sm-arr" /></g>
      <g transform="translate(136, 6)">
        <rect x="0" y="0" width="58" height="18" rx="4" fill="#eff6ff" stroke="#60a5fa" />
        <rect x="7" y="3" width="7.5" height="11.5" rx="1.2" fill="#3b82f6" />
        <text x="35" y="12.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e40af">手牌</text>
      </g>
      <g transform="translate(136, 28)" opacity="0.65">
        <rect x="0" y="0" width="58" height="18" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
        <rect x="7" y="3" width="7.5" height="11.5" rx="1.2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8" />
        <text x="35" y="12.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#475569">弃牌堆</text>
      </g>
    </g>
