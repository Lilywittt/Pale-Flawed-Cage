<svg viewBox="0 0 888 214" width="888" height="214" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif">
  <defs>
    <g id="df-sta"><polygon points="1,-5.5 -3.8,0.8 0,0.8 -1,5.5 3.8,-0.8 0,-0.8" fill="#eab308" /></g>
    <g id="df-psy"><polygon points="0,-5 4.4,0 0,5 -4.4,0" fill="#a855f7" /><circle r="1.3" fill="#ffffff" /></g>
    <g id="df-tru"><polygon points="0,-5 1.5,-1.5 5,-1.2 2.2,1.1 3.1,4.7 0,2.7 -3.1,4.7 -2.2,1.1 -5,-1.2 -1.5,-1.5" fill="#06b6d4" /></g>
    <g id="df-clu"><circle cx="-1" cy="-1" r="3.2" fill="none" stroke="#10b981" stroke-width="1.7" /><line x1="1.4" y1="1.4" x2="4.3" y2="4.3" stroke="#10b981" stroke-width="1.7" stroke-linecap="round" /></g>
    <g id="df-haz"><polygon points="0,-4.8 4.8,4.2 -4.8,4.2" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linejoin="round" /><line x1="0" y1="-1" x2="0" y2="1.8" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" /></g>
    <g id="df-opp"><rect x="-4" y="-4.6" width="8" height="9.2" rx="1.3" fill="none" stroke="#6366f1" stroke-width="1.7" /><circle r="1.5" fill="#6366f1" /></g>
    <g id="df-san"><rect x="-1.5" y="-5" width="3" height="10" rx="0.7" fill="#14b8a6" /><rect x="-5" y="-1.5" width="10" height="3" rx="0.7" fill="#14b8a6" /></g>

    <g id="df-phase-arr">
