    <rect x="1" y="1" width="262" height="27" rx="7" fill="#1e293b" />
    <circle cx="19" cy="14.5" r="8.5" fill="#475569" />
    <text x="19" y="18" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">3</text>
    <text x="35" y="19" font-size="12" font-weight="800" fill="#f8fafc">夜间</text>
    <path d="M 244 9 A 6.5 6.5 0 1 0 250 19 A 5.2 5.2 0 1 1 244 9 Z" fill="#fde047" />

    <!-- Endgame Check -->
    <g transform="translate(14, 35)">
      <rect width="236" height="25" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2" />
      <rect x="10" y="7.5" width="34" height="10" rx="5" fill="#10b981" />
      <rect x="49" y="7.5" width="34" height="10" rx="5" fill="#f59e0b" />
      <rect x="88" y="7.5" width="34" height="10" rx="5" fill="#ef4444" />
      <g transform="translate(136, 12.5)"><use href="#df-sm-arr" /></g>
      <circle cx="162" cy="12.5" r="8" fill="#0f172a" />
      <text x="162" y="15.8" text-anchor="middle" font-size="8.5" font-weight="800" fill="#ffffff">因</text>
      <text x="196" y="16.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#92400e">终局</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(14, 65)">
      <rect width="236" height="23" rx="4.5" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="14" cy="11.5" r="7" fill="#cbd5e1" /><text x="14" y="14.8" text-anchor="middle" font-size="8" font-weight="800" fill="#334155">1</text>
      <g transform="translate(46, 11.5) scale(0.9)"><use href="#df-opp" /></g>
      <text x="72" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#4338ca">机会</text>
      <g transform="translate(104, 11.5)"><use href="#df-sm-arr" /></g>
      <g transform="translate(128, 11.5) scale(0.9)"><use href="#df-san" /></g>
      <text x="154" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e">理智</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(14, 92)">
      <rect width="236" height="23" rx="4.5" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="14" cy="11.5" r="7" fill="#cbd5e1" /><text x="14" y="14.8" text-anchor="middle" font-size="8" font-weight="800" fill="#334155">2</text>
      <rect x="34" y="4" width="20" height="15" rx="2.5" fill="#e2e8f0" stroke="#94a3b8" />
      <text x="44" y="15" text-anchor="middle" font-size="9.5" font-weight="800" fill="#334155">+</text>
      <g transform="translate(68, 11.5)"><use href="#df-sm-arr" /></g>
      <g transform="translate(92, 11.5) scale(0.9)"><use href="#df-sta" /></g>
      <g transform="translate(114, 11.5) scale(0.9)"><use href="#df-psy" /></g>
      <g transform="translate(136, 11.5) scale(0.9)"><use href="#df-tru" /></g>
      <g transform="translate(158, 11.5) scale(0.9)"><use href="#df-clu" /></g>
      <g transform="translate(180, 11.5) scale(0.9)"><use href="#df-haz" /></g>
      <g transform="translate(202, 11.5) scale(0.9)"><use href="#df-opp" /></g>
    </g>

    <!-- Step 3 -->
    <g transform="translate(14, 119)">
      <rect width="236" height="23" rx="4.5" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="14" cy="11.5" r="7" fill="#cbd5e1" /><text x="14" y="14.8" text-anchor="middle" font-size="8" font-weight="800" fill="#334155">3</text>
      <g transform="translate(36, 4.5)">
        <rect x="0" y="0" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="14" y="0" width="14" height="14" fill="#ffffff" stroke="#cbd5e1" />
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
        <path d="M11.5,7 H22 M19.5,4.8 L22.5,7 L19.5,9.2" fill="none" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <line x1="84" y1="5" x2="84" y2="18" stroke="#e2e8f0" />
      <g transform="translate(112, 11.5)">
        <circle r="6.2" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3" />
        <polygon points="0,-3 2.8,2 0,0.8 -2.8,2" fill="#4f46e5" />
        <g transform="translate(16, 0) scale(0.82)"><use href="#df-refresh" /></g>
      </g>
      <line x1="150" y1="5" x2="150" y2="18" stroke="#e2e8f0" />
      <g transform="translate(176, 11.5)">
        <rect x="-5.5" y="-5.8" width="8.5" height="11.6" rx="1.4" fill="#3b82f6" />
        <g transform="translate(14, 0) scale(0.82)"><use href="#df-refresh" /></g>
      </g>
    </g>
  </g>

  <!-- Bottom Return Loop: Night -> Next Morning -->
  <path d="M 738 182 L 738 197 Q 738 201 734 201 L 140 201 Q 136 201 136 197 L 136 185" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="4 3" />
  <polyline points="132,189 136,183.5 140,189" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
